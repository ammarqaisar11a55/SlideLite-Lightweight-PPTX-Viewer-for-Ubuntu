name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            python3-venv xvfb fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      - name: Dev tools
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Lint
        run: |
          .venv/bin/ruff check slidelite tests tools
          .venv/bin/ruff format --check slidelite tests tools
      - name: Python tests
        run: xvfb-run -a .venv/bin/python -m pytest
      - name: JS tests
        run: if ls tests/js/*.test.mjs >/dev/null 2>&1; then node --test tests/js/; fi
      - name: Build .deb
        run: if [ -x packaging/build-deb.sh ]; then packaging/build-deb.sh; fi
      - uses: actions/upload-artifact@v4
        with:
          name: slidelite-deb
          path: "*.deb"
          if-no-files-found: ignore
