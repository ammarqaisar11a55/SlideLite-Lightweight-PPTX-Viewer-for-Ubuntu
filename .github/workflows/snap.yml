name: Snap

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths: ["snap/**", ".github/workflows/snap.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    name: Build & smoke-test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # Only publish from tags, and only once the store login secret exists.
      STORE_LOGIN: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Install snap and its runtimes
        run: |
          sudo snap install core24 gnome-46-2404 gtk-common-themes mesa-2404
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          for plug in gnome-46-2404:gnome-46-2404 gpu-2404:mesa-2404:gpu-2404 \
                      gtk-3-themes:gtk-common-themes:gtk-3-themes \
                      icon-themes:gtk-common-themes:icon-themes \
                      sound-themes:gtk-common-themes:sound-themes; do
            IFS=: read -r name provider slot <<< "$plug"
            sudo snap connect "slidelite:$name" "$provider${slot:+:$slot}" || true
          done
          snap connections slidelite

      - name: Smoke test
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb
          slidelite --version
          # No dbus-run-session: snap run needs the runner's real systemd user scope.
          xvfb-run -a slidelite --smoke-test "$PWD/tests/fixtures/shapes.pptx"
          xvfb-run -a slidelite --smoke-test "$PWD/tests/fixtures/binary-deck.ppt"

      - uses: actions/upload-artifact@v4
        with:
          name: slidelite-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      - name: Publish to the Snap Store (stable)
        if: startsWith(github.ref, 'refs/tags/v') && env.STORE_LOGIN != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
